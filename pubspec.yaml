name: owl_fp_newer
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.7.0
  get: ^4.6.6
  get_storage: ^2.1.1
  intl: ^0.18.1
  dio: ^4.0.6
  sqflite: ^2.2.8+4
  equatable: ^2.0.5
  lucide_icons: ^0.257.0
  flutter_keyboard_visibility: ^6.0.0
  path: ^1.8.2
  retrofit: ^3.3.1
  google_fonts: ^4.0.4
  shimmer: ^3.0.0
  flutter_typeahead: ^5.2.0
  cupertino_icons: ^1.0.8
  flutter_bluetooth_classic_serial:
    path: packages/flutter_bluetooth_classic_serial
  permission_handler: ^12.0.1
  package_info_plus: ^8.0.0
  path_provider: ^2.1.5
  ota_update: ^6.0.0
  # install_plugin: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  rename_app: ^1.3.1

# ✅ Bagian ini sudah benar untuk generate icon
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/owl.logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/image/owl.logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/image/
    - assets/icons/
